<!doctype html>
<!-- Generated by node build-standalone.mjs; Tailwind loads from the CDN. -->
<html lang="de" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Nmap XML Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
  <style>.nmap-viewer {
  max-width: 80rem;
  margin: auto;
  padding: 2rem 1rem;
  color: var(--color-gray-100);
}
.nmap-viewer h1 {
  font-size: 2rem;
  font-weight: 700;
  margin-bottom: 1rem;
}
.nmap-viewer > p {
  margin: 1rem 0;
}
.nmap-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 1rem;
  margin: 1.5rem 0;
}
.nmap-controls label {
  display: grid;
  gap: .5rem;
  min-width: 0;
  max-width: 100%;
}
.nmap-controls input {
  min-width: 0;
  width: 100%;
}
.nmap-controls input,
.nmap-controls select,
.nmap-controls button {
  padding: .6rem;
  border: 1px solid var(--color-gray-500);
  border-radius: .5rem;
  background: var(--color-gray-800);
  color: inherit;
  max-width: 100%;
}
.nmap-controls button,
.nmap-viewer summary {
  cursor: pointer;
}
.nmap-viewer :focus-visible {
  outline: 2px solid var(--color-blue-400);
  outline-offset: 3px;
}
.nmap-viewer summary {
  overflow-wrap: anywhere;
}

  body { min-height: 100vh; background: #020617; }
  </style>
</head>
<body>
<main><section class="nmap-viewer" aria-labelledby="nmap-title">
    <h1 id="nmap-title">Nmap XML ansehen</h1>
    <p>Öffne eine XML-Datei aus einem Nmap-Scan mit <code>-oX scan.xml</code> oder <code>-oA scan</code>.</p>
    <p>Die Datei bleibt in deinem Browser. Sie wird weder hochgeladen noch gespeichert.</p>
    <div class="nmap-controls">
        <label>XML-Datei (max. 10 MiB)
            <input id="nmap-file" type="file" accept=".xml,application/xml,text/xml">
        </label>
        <button id="nmap-clear" type="button">Zurücksetzen</button>
    </div>
    <p id="nmap-message" role="status" aria-live="polite">Noch keine Datei geöffnet.</p>
    <div id="nmap-results" hidden>
        <p id="nmap-summary" class="my-4 text-sm font-medium text-slate-300"></p>
        <div class="nmap-controls">
            <label>Hosts, Ports, Dienste oder NSE-Ausgaben suchen
                <input id="nmap-search" type="search" placeholder="z. B. 192.168.1.10, 443 oder ssh">
            </label>
            <label>Port-Zustand
                <select id="nmap-state">
                    <option value="">Alle Zustände</option>
                    <option value="open">open</option>
                    <option value="filtered">filtered</option>
                    <option value="closed">closed</option>
                    <option value="open|filtered">open|filtered</option>
                    <option value="closed|filtered">closed|filtered</option>
                    <option value="unfiltered">unfiltered</option>
                </select>
            </label>
        </div>
        <p id="nmap-matches" role="status" class="mb-4 text-sm text-slate-400"></p>
        <div id="nmap-hosts" class="space-y-4"></div>
    </div>
</section></main>
<script>
"use strict";
(() => {
  // assets/nmap-visualizer.ts
  function attribute(element, name) {
    return element?.getAttribute(name) ?? "";
  }
  function scriptOutput(element) {
    return {
      name: attribute(element, "id") || "NSE-Skript",
      output: attribute(element, "output")
    };
  }
  function parseScan(xml) {
    if (/<!ENTITY\s/i.test(xml)) {
      throw new Error("XML mit eigenen Entities wird nicht unterstützt.");
    }
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.querySelector("parsererror") || doc.documentElement.tagName !== "nmaprun") {
      throw new Error("Bitte eine gültige Nmap-XML-Datei öffnen.");
    }
    return Array.from(doc.querySelectorAll("nmaprun > host"), (host) => ({
      title: [
        ...new Set(
          Array.from(
            host.querySelectorAll(
              ":scope > address, :scope > hostnames > hostname"
            ),
            (item) => attribute(item, item.tagName === "address" ? "addr" : "name")
          ).filter(Boolean)
        )
      ].join(" · ") || "Host ohne Adresse",
      state: attribute(host.querySelector(":scope > status"), "state") || "unbekannt",
      os: attribute(host.querySelector(":scope > os > osmatch"), "name"),
      ports: Array.from(
        host.querySelectorAll(":scope > ports > port"),
        (port) => {
          const service = port.querySelector(":scope > service");
          return {
            port: attribute(port, "portid"),
            protocol: attribute(port, "protocol"),
            state: attribute(port.querySelector(":scope > state"), "state"),
            service: attribute(service, "name"),
            version: ["product", "version", "extrainfo"].map(
              (key) => attribute(service, key)
            ).filter(Boolean).join(" "),
            scripts: Array.from(
              port.querySelectorAll(":scope > script"),
              scriptOutput
            )
          };
        }
      ),
      notes: [
        ...Array.from(
          host.querySelectorAll(":scope > ports > extraports"),
          (ports) => `${attribute(ports, "count")} weitere Ports: ${attribute(ports, "state")}`
        )
      ],
      scripts: Array.from(
        host.querySelectorAll(":scope > hostscript > script"),
        scriptOutput
      )
    }));
  }
  function textElement(tag, text) {
    const element = document.createElement(tag);
    element.textContent = text;
    return element;
  }
  function statusBadge(state) {
    let color = "bg-slate-500/15 text-slate-300 ring-slate-500/30";
    let icon = "?";
    switch (state) {
      case "open":
      case "up":
        color = "bg-emerald-500/15 text-emerald-300 ring-emerald-500/30";
        icon = "✓";
        break;
      case "closed":
      case "down":
        color = "bg-rose-500/15 text-rose-300 ring-rose-500/30";
        icon = "×";
        break;
      case "filtered":
      case "open|filtered":
      case "closed|filtered":
        color = "bg-amber-500/15 text-amber-300 ring-amber-500/30";
        icon = "◈";
        break;
      case "unfiltered":
        color = "bg-sky-500/15 text-sky-300 ring-sky-500/30";
        icon = "↔";
    }
    const badge = textElement("span", "");
    badge.className = `inline-flex items-center gap-1.5 whitespace-nowrap rounded-full px-2.5 py-1 text-xs font-semibold ring-1 ring-inset ${color}`;
    badge.dataset.state = state;
    const symbol = textElement("span", icon);
    symbol.setAttribute("aria-hidden", "true");
    badge.append(symbol, textElement("span", state || "unbekannt"));
    return badge;
  }
  function scriptDetails(script) {
    const details = document.createElement("details");
    details.className = "group/nse rounded-lg border border-slate-700/70 bg-slate-950/40";
    const summary = document.createElement("summary");
    summary.className = "flex cursor-pointer list-none items-start gap-2 rounded-lg p-3 hover:bg-slate-800/60";
    const arrow = textElement("span", "›");
    arrow.className = "text-slate-400 transition-transform group-open/nse:rotate-90";
    arrow.setAttribute("aria-hidden", "true");
    const label = document.createElement("span");
    label.className = "min-w-0 flex-1";
    const name = textElement("span", script.name);
    name.className = "block break-words font-mono text-xs font-semibold text-sky-300";
    const preview = textElement(
      "span",
      script.output.trim().split(/\r?\n/)[0] || "Keine Textausgabe."
    );
    preview.className = "mt-1 block truncate text-xs text-slate-400";
    label.append(name, preview);
    summary.append(arrow, label);
    const toolbar = document.createElement("div");
    toolbar.className = "flex items-center gap-3 border-t border-slate-700/60 px-3 py-2";
    const copy = textElement("button", "Kopieren");
    copy.type = "button";
    copy.setAttribute("aria-label", `${script.name} kopieren`);
    copy.className = "cursor-pointer rounded-md border border-slate-600 px-2 py-1 text-xs text-slate-300 hover:bg-slate-700 hover:text-white";
    const feedback = textElement("span", "");
    feedback.className = "text-xs text-slate-400";
    feedback.setAttribute("role", "status");
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(script.output);
        feedback.textContent = "Kopiert.";
      } catch {
        feedback.textContent = "Bitte den Text manuell kopieren.";
      }
    });
    toolbar.append(copy, feedback);
    const output = textElement("pre", script.output || "Keine Textausgabe.");
    output.className = "m-0 max-h-64 overflow-auto whitespace-pre p-3 font-mono text-xs leading-relaxed text-slate-200";
    details.append(summary, toolbar, output);
    return details;
  }
  var viewer = document.querySelector(".nmap-viewer");
  if (viewer) {
    let render2 = function() {
      const query = search.value.trim().toLocaleLowerCase();
      const content = document.createDocumentFragment();
      let count = 0;
      for (const host of scan) {
        const ports = host.ports.filter(
          (port) => !state.value || port.state === state.value
        );
        if (state.value && ports.length === 0) continue;
        const searchable = [
          host.title,
          host.state,
          host.os,
          ...host.notes,
          ...host.scripts.flatMap((script) => [script.name, script.output]),
          ...ports.flatMap((port) => [
            `${port.port}/${port.protocol}`,
            port.state,
            port.service,
            port.version,
            ...port.scripts.flatMap((script) => [script.name, script.output])
          ])
        ];
        if (query && !searchable.join(" ").toLocaleLowerCase().includes(query)) {
          continue;
        }
        count++;
        const details = document.createElement("details");
        details.className = "group/host overflow-hidden rounded-xl border border-slate-700/70 bg-slate-900/50 shadow-sm";
        const heading = document.createElement("summary");
        heading.className = "flex cursor-pointer list-none flex-wrap items-center gap-3 bg-slate-800/50 p-4 hover:bg-slate-800/80";
        const arrow = textElement("span", "›");
        arrow.className = "text-slate-400 transition-transform group-open/host:rotate-90";
        arrow.setAttribute("aria-hidden", "true");
        const title = textElement("span", host.title);
        title.className = "min-w-0 flex-1 break-words font-mono text-sm font-semibold text-slate-100";
        const portCount = textElement("span", `${ports.length} Ports`);
        portCount.className = "text-xs text-slate-400";
        heading.append(arrow, title, statusBadge(host.state), portCount);
        const hostBody = document.createElement("div");
        hostBody.className = "border-t border-slate-700/60 p-4";
        details.append(heading, hostBody);
        if (host.os) {
          const os = textElement("p", `Betriebssystem: ${host.os}`);
          os.className = "mb-4 text-sm text-slate-400";
          hostBody.append(os);
        }
        if (ports.length) {
          const wrapper = document.createElement("div");
          wrapper.className = "overflow-x-auto rounded-lg border border-slate-700/60";
          const table = document.createElement("table");
          table.className = "w-full min-w-[52rem] table-fixed text-left text-sm";
          const caption = table.createCaption();
          caption.className = "sr-only";
          caption.textContent = `Ports für ${host.title}`;
          const header = table.createTHead().insertRow();
          header.className = "bg-slate-800/80 text-xs font-semibold uppercase tracking-wide text-slate-400";
          for (const [label, width] of [
            ["Port", "w-20"],
            ["Protokoll", "w-24"],
            ["Zustand", "w-44"],
            ["Dienst", "w-32"],
            ["Produkt / Version", "w-36"],
            ["NSE-Ausgaben", ""]
          ]) {
            const cell = textElement("th", label);
            cell.className = `px-4 py-3 ${width}`;
            cell.scope = "col";
            header.append(cell);
          }
          const body = table.createTBody();
          for (const port of ports) {
            const row = body.insertRow();
            row.className = "border-t border-slate-700/50 text-slate-300 odd:bg-slate-900/40 hover:bg-slate-800/40";
            for (const [value, style] of [
              [port.port, "font-mono font-semibold text-sky-300"],
              [port.protocol, "font-mono text-xs uppercase text-slate-400"],
              ["", ""],
              [port.service, "whitespace-nowrap font-mono text-xs"],
              [
                port.version,
                "break-words text-xs leading-relaxed text-slate-400"
              ]
            ]) {
              const cell = textElement("td", value || "—");
              cell.className = `px-4 py-4 align-top ${style}`;
              row.append(cell);
            }
            row.cells[2].replaceChildren(statusBadge(port.state));
            const scripts = row.insertCell();
            scripts.className = "space-y-2 px-4 py-3 align-top";
            if (port.scripts.length) {
              scripts.append(...port.scripts.map(scriptDetails));
            } else scripts.append(textElement("span", "—"));
          }
          wrapper.append(table);
          hostBody.append(wrapper);
        } else {
          hostBody.append(
            textElement(
              "p",
              "Keine einzeln aufgeführten Ports (z. B. bei einem Discovery-Scan)."
            )
          );
        }
        for (const note of host.notes) {
          const text = textElement("p", note);
          text.className = "mt-3 text-xs text-slate-400";
          hostBody.append(text);
        }
        if (host.scripts.length) {
          const scripts = document.createElement("div");
          scripts.className = "mt-4 space-y-2";
          const label = textElement("h2", "Host-NSE-Ausgaben");
          label.className = "mb-3 text-sm font-semibold text-slate-300";
          scripts.append(label, ...host.scripts.map(scriptDetails));
          hostBody.append(scripts);
        }
        content.append(details);
      }
      hosts.replaceChildren(content);
      matches.textContent = `${count} von ${scan.length} Hosts angezeigt.`;
    }, reset2 = function() {
      loadVersion++;
      scan = [];
      fileInput.value = "";
      search.value = "";
      state.value = "";
      hosts.replaceChildren();
      results.hidden = true;
      message.textContent = "Noch keine Datei geöffnet.";
    };
    render = render2, reset = reset2;
    const fileInput = viewer.querySelector("#nmap-file");
    const search = viewer.querySelector("#nmap-search");
    const state = viewer.querySelector("#nmap-state");
    const message = viewer.querySelector("#nmap-message");
    const results = viewer.querySelector("#nmap-results");
    const summary = viewer.querySelector("#nmap-summary");
    const matches = viewer.querySelector("#nmap-matches");
    const hosts = viewer.querySelector("#nmap-hosts");
    let scan = [];
    let loadVersion = 0;
    fileInput.addEventListener("change", async () => {
      const file = fileInput.files?.[0];
      if (!file) return;
      reset2();
      const version = loadVersion;
      message.textContent = "Datei wird gelesen …";
      try {
        if (file.size > 10 * 1024 * 1024) {
          throw new Error("Die Datei ist größer als 10 MiB.");
        }
        const xml = await file.text();
        if (version !== loadVersion) return;
        scan = parseScan(xml);
        const ports = scan.flatMap((host) => host.ports);
        const services = new Set(
          ports.map((port) => port.service).filter(Boolean)
        );
        summary.textContent = `${scan.length} Hosts · ${ports.filter((port) => port.state === "open").length} offene Ports · ${services.size} Dienste`;
        message.textContent = file.name;
        results.hidden = false;
        render2();
      } catch (error) {
        if (version !== loadVersion) return;
        message.textContent = error instanceof Error ? error.message : "Die Datei konnte nicht gelesen werden.";
      }
    });
    search.addEventListener("input", render2);
    state.addEventListener("change", render2);
    viewer.querySelector("#nmap-clear").addEventListener("click", reset2);
  }
  var render;
  var reset;
})();
</script>
</body>
</html>
