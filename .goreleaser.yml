# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: no_trainer
dist: build
before:
  hooks:
    - go mod tidy
    - go mod download
    - pnpm install --frozen-lockfile
    - pnpm prod
    - go test ./...
builds:
  - id: linux-builds
    binary: no_trainer
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: ["amd64", "arm64"]
    flags: [-trimpath]
    ldflags:
      - -s -w
upx:
  - enabled: true
    ids: [linux-builds]
    compress: best
    lzma: true
archives:
  - formats: [binary]
dockers_v2:
  - ids: [linux-builds]
    dockerfile: Containerfile
    images: ["registry.gitlab.com/pidrakin/no_trainer"]
    tags: ["{{ .Version }}", "latest"]
    platforms: ["linux/amd64", "linux/arm64"]
    flags: ["--pull"]
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .GitURL }}"
snapshot:
  version_template: "{{ .Tag }}-SNAPSHOT"
changelog:
  sort: asc
  filters:
    exclude:
    - "^test:"
    - "merge conflict"
    - Merge pull request
    - Merge remote-tracking branch
    - Merge branch
    - go mod tidy
  groups:
    - title: Features
      regexp: "^.*feat:.*$"
      order: 0
    - title: Changes
      regexp: "^.*change:.*$"
      order: 1
    - title: "Dependency updates"
      regexp: "^.*feat[(]deps[)]:.*$"
      order: 2
    - title: "Bug fixes"
      regexp: "^.*fix:.*$"
      order: 3
    - title: "Documentation updates"
      regexp: "^.*docs:.*$"
      order: 4
    - title: Others
      order: 999
release:
  mode: replace
  disable: '{{ eq .Env.NO_TRAINER_IMAGES_ONLY "true" }}'
announce:
  telegram:
    enabled: true
    chat_id: -1001510892782
    message_template: |
      {{ mdv2escape "no_trainer" }} {{ mdv2escape .Tag }}

      Awesome new version is out
      Check it out at {{ mdv2escape .ReleaseURL }}

      {{ mdv2escape (replace .ReleaseNotes "#" "") }}
