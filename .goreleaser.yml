# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: no_trainer
dist: build
before:
  hooks:
    - go mod tidy
    - go mod download
    - pnpm install
    - pnpm prod
builds:
  - id: linux-builds
    binary: no_trainer
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: ["amd64"]
    flags: [-trimpath]
    ldflags:
      - -s -w
    no_unique_dist_dir: true
upx:
  - enabled: true
    ids: [linux-builds]
    compress: best
    lzma: true
archives:
  - format: binary
dockers:
  - ids: [linux-builds]
    goos: linux
    goarch: amd64
    image_templates: ["registry.gitlab.com/pidrakin/no_trainer:{{ .Version }}-amd64"]
    dockerfile: Containerfile
    use: buildx
    build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.name={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--label=org.opencontainers.image.source={{.GitURL}}"
    - "--platform=linux/amd64"
docker_manifests:
  - name_template: "registry.gitlab.com/pidrakin/no_trainer:{{ .Version }}"
    image_templates:
    - "registry.gitlab.com/pidrakin/no_trainer:{{ .Version }}-amd64"
  - name_template: "registry.gitlab.com/pidrakin/no_trainer:latest"
    image_templates:
    - "registry.gitlab.com/pidrakin/no_trainer:{{ .Version }}-amd64"
snapshot:
  name_template: "{{ .Tag }}-SNAPSHOT"
changelog:
  sort: asc
  filters:
    exclude:
    - "^test:"
    - "merge conflict"
    - Merge pull request
    - Merge remote-tracking branch
    - Merge branch
    - go mod tidy
  groups:
    - title: Features
      regexp: "^.*feat:.*$"
      order: 0
    - title: Changes
      regexp: "^.*change:.*$"
      order: 1
    - title: "Dependency updates"
      regexp: "^.*feat[(]deps[)]:.*$"
      order: 2
    - title: "Bug fixes"
      regexp: "^.*fix:.*$"
      order: 3
    - title: "Documentation updates"
      regexp: "^.*docs:.*$"
      order: 4
    - title: Others
      order: 999
release:
  mode: replace
announce:
  telegram:
    enabled: true
    chat_id: -1001510892782
    message_template: |
      {{ mdv2escape "no_trainer" }} {{ mdv2escape .Tag }}

      Awesome new version is out
      Check it out at {{ mdv2escape .ReleaseURL }}

      {{ mdv2escape (replace .ReleaseNotes "#" "") }}
