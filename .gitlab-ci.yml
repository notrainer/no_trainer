variables:
  # Please edit to your GitLab project
  REPO_NAME: gitlab.com/pidrakin/no_trainer

stages:
  - release

release:
  stage: release
  image: docker:29.8.2-cli
  services:
    - docker:29.8.2-dind
  only:
    refs:
      - tags
  variables:
    # Optionally use GitLab's built-in image registry.
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script: |
    set -eu
    ID=$(cat <<EOF | docker build -q -
    FROM goreleaser/goreleaser:v2.18.2
    RUN apk add --no-cache upx nodejs npm && \
      npm install -g pnpm@12.8.1 && \
      rm -rf /usr/local/go && \
      curl -fsSL https://go.dev/dl/go1.27.1.linux-amd64.tar.gz | tar -C /usr/local -xzf -
    EOF
    )

    # GITLAB_TOKEN is needed to create GitLab releases.
    # DOCKER_* are needed to push Docker images.
    # The Docker service cannot bind-mount the job container's checkout.
    RELEASE_CONTAINER=$(docker create --entrypoint /bin/sh \
      -w /src \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -e DOCKER_USERNAME -e DOCKER_PASSWORD -e DOCKER_REGISTRY  \
      -e GITLAB_TOKEN \
      -e TELEGRAM_TOKEN -e NO_TRAINER_SKIP_ANNOUNCE -e NO_TRAINER_IMAGES_ONLY \
      "$ID" -ec '
        git config --global --add safe.directory /src
        printf "%s" "$DOCKER_PASSWORD" | docker login "$DOCKER_REGISTRY" --username "$DOCKER_USERNAME" --password-stdin
        if [ "${NO_TRAINER_SKIP_ANNOUNCE:-}" = "true" ]; then
          exec goreleaser release --clean --skip=announce
        fi
        exec goreleaser release --clean
      ')
    trap 'docker rm -f "$RELEASE_CONTAINER" >/dev/null 2>&1 || true' EXIT
    docker cp "$CI_PROJECT_DIR/." "$RELEASE_CONTAINER:/src/"
    docker start --attach "$RELEASE_CONTAINER"
    RELEASE_STATUS=$(docker inspect --format '{{.State.ExitCode}}' "$RELEASE_CONTAINER")
    docker rm "$RELEASE_CONTAINER"
    trap - EXIT
    docker rmi "$ID"
    exit "$RELEASE_STATUS"
