variables:
  # Please edit to your GitLab project
  REPO_NAME: gitlab.com/pidrakin/no_trainer

stages:
  - release

release:
  stage: release
  image: docker:stable
  services:
    - docker:dind
  only:
    refs:
      - tags
  variables:
    # Optionally use GitLab's built-in image registry.
    DOCKER_REGISTRY: $CI_REGISTRY
    DOCKER_USERNAME: $CI_REGISTRY_USER
    DOCKER_PASSWORD: $CI_REGISTRY_PASSWORD
    GITLAB_TOKEN: $CI_JOB_TOKEN
    # Disable shallow cloning so that goreleaser can diff between tags to
    # generate a changelog.
    GIT_DEPTH: 0
  script: |
    ID=$(cat <<EOF | docker build -q -
    FROM goreleaser/goreleaser:v1.26.1
    RUN apk add --no-cache upx nodejs npm && \
      npm install -g pnpm && \
      curl -fsSL https://go.dev/dl/go1.22.2.linux-amd64.tar.gz | tar -C /usr/local -xzf -
    EOF
    )

    # GITLAB_TOKEN is needed to create GitLab releases.
    # DOCKER_* are needed to push Docker images.
    docker run --rm --privileged \
      -v $PWD:/go/src/gitlab.com/pidrakin/no_trainer \
      -w /go/src/gitlab.com/pidrakin/no_trainer \
      -v /var/run/docker.sock:/var/run/docker.sock \
      -e DOCKER_USERNAME -e DOCKER_PASSWORD -e DOCKER_REGISTRY  \
      -e GITLAB_TOKEN \
      -e TELEGRAM_TOKEN \
      $ID release --clean --fail-fast --skip=validate
    docker rmi $ID
